<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8161f"/>
      <stop offset="1" stop-color="#a80a12"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- 圆角徽标底（校徽红渐变） -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <!-- 内沿细线（校名蓝点缀） -->
  <rect x="34" y="34" width="444" height="444" rx="94" fill="none"
        stroke="#0a4a9e" stroke-opacity="0.55" stroke-width="6"/>

  <!-- WiFi 弧（连上校园网） -->
  <path d="M172 142 A120 120 0 0 1 340 142" fill="none" stroke="url(#arc)"
        stroke-width="24" stroke-linecap="round"/>
  <path d="M208 176 A68 68 0 0 1 304 176" fill="none" stroke="url(#arc)"
        stroke-width="24" stroke-linecap="round"/>

  <!-- Portal 圆环（认证门户） -->
  <circle cx="256" cy="306" r="98" fill="none" stroke="#ffffff" stroke-width="28"/>

  <!-- 在线对勾（已登录） -->
  <polyline points="218,308 246,336 300,278" fill="none" stroke="#ffffff"
            stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
