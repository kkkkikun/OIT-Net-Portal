name: Release

# 打 v* 标签即触发：构建 Android debug APK 与 Windows 独立 exe，
# 并把它们挂到对应的 GitHub Release 上。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的标签名，例如 v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  android:
    name: 构建 debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 手动触发（workflow_dispatch）时按输入的标签构建，保证产物对应标签内容
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # 不用 android-actions/setup-android：它会去装早已下架的 'tools' 包，
      # sdkmanager 以 exit 1 挂掉整步（2026-11-01 首轮 CI 踩过）。runner 镜像自带 SDK。
      - name: 定位 sdkmanager + 写 local.properties
        run: |
          set -e
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for base in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "/usr/local/lib/android/sdk" "$HOME/Android/Sdk"; do
              if [ -z "$base" ]; then continue; fi
              found="$(ls -d "$base"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
              if [ -n "$found" ]; then SDKMANAGER="$found"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::找不到 sdkmanager"
            exit 1
          fi
          # SDK 根目录 = sdkmanager 往上三层（…/cmdline-tools/<ver>/bin/sdkmanager）
          SDK_ROOT="$(cd "$(dirname "$(readlink -f "$SDKMANAGER")")/../../.." && pwd)"
          echo "使用 $SDKMANAGER（SDK 根：$SDK_ROOT）"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_ROOT" > android/local.properties
      - name: 接受 Android SDK 许可（sdkmanager 是交互式的，全 y）
        run: yes | "$SDKMANAGER" --licenses || true
      - name: 安装 Android SDK 组件
        run: |
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: 单测 + lint + 构建 APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows:
    name: 构建 Windows 独立 exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 检查 tkinter（托盘界面依赖）
        run: python -c "import tkinter; print('tkinter OK')"
      - name: 构建 exe
        shell: powershell
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: OIT-Portal-windows
          path: dist/OIT-Portal.exe
          if-no-files-found: error

  publish:
    name: 创建 / 更新 GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 组装附件
        run: |
          mkdir -p dist-assets
          find artifacts -name 'app-debug.apk' -exec cp {} dist-assets/OIT-Portal-debug.apk \;
          find artifacts -name 'OIT-Portal.exe' -exec cp {} dist-assets/OIT-Portal-windows.exe \;
          ls -l dist-assets
      - name: 创建 / 更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          notes=$(mktemp)
          if [ -f CHANGELOG.md ]; then
            # 取 CHANGELOG 里对应标签的小节。
            # 用 index() 而不是正则：方括号在 ERE 里是字符类开头，转义极易写错
            # （原写法实测匹配不到任何行，发布说明会退化成一句占位话）。
            # CHANGELOG 标题不带 v、标签带 v，两种写法都认。
            awk -v tag="${TAG#v}" '
              index($0, "## [" tag "]") == 1 || index($0, "## [v" tag "]") == 1 {found=1; next}
              found && index($0, "## [") == 1 {exit}
              found {print}
            ' CHANGELOG.md > "$notes"
          fi
          if [ ! -s "$notes" ]; then
            printf '%s\n\n%s\n' "$TAG" "见 CHANGELOG.md 与仓库文档。" > "$notes"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-assets/* --clobber
            gh release edit "$TAG" --title "OIT-Net-Portal $TAG" --notes-file "$notes"
          else
            gh release create "$TAG" dist-assets/* --title "OIT-Net-Portal $TAG" --notes-file "$notes"
          fi
