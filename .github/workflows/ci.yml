name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python 测试（pytest，无网络）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tray]"
      - name: pytest
        run: python -m pytest -q

  android:
    name: Android 构建 + 单测 + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: 安装 Android SDK 组件
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: 单测 + lint + 构建 APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: 上传 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows-exe:
    name: Windows 独立 exe 构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 检查 tkinter（托盘界面依赖，缺了 PyInstaller 会失败）
        run: python -c "import tkinter; print('tkinter OK')"
      - name: 构建 exe
        shell: powershell
        run: ./scripts/build_windows.ps1
      - name: 上传独立 exe
        uses: actions/upload-artifact@v4
        with:
          name: OIT-Portal-windows
          path: dist/OIT-Portal.exe
          if-no-files-found: error
