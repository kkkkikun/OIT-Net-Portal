name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python 测试（pytest，无网络）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tray]"
      - name: pytest
        run: python -m pytest -q

  android:
    name: Android 构建 + 单测 + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Chaquopy 要求「构建机的 Python 大小版本 == App 内嵌的 Python 版本」。
      # App 内嵌 3.10（android/app/build.gradle.kts 的 chaquopy.version），
      # 而 runner 镜像自带的是 3.12 → 会报 "Couldn't find Python 3.10"。
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 确认构建机 Python 版本
        run: python3.10 --version
      # 不用 android-actions/setup-android：它在 runner 预装 SDK 上会去装早已下架的
      # 'tools' 包，sdkmanager 报 "Failed to find package 'tools'" 并以 exit 1 挂掉整步
      # （2026-11-01 首轮 CI 就是这么红的）。runner 镜像自带完整 SDK，直接用即可。
      - name: 定位 sdkmanager + 写 local.properties
        run: |
          set -e
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for base in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" "/usr/local/lib/android/sdk" "$HOME/Android/Sdk"; do
              if [ -z "$base" ]; then continue; fi
              found="$(ls -d "$base"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
              if [ -n "$found" ]; then SDKMANAGER="$found"; break; fi
            done
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::找不到 sdkmanager"
            exit 1
          fi
          # SDK 根目录 = sdkmanager 往上三层（…/cmdline-tools/<ver>/bin/sdkmanager）
          SDK_ROOT="$(cd "$(dirname "$(readlink -f "$SDKMANAGER")")/../../.." && pwd)"
          echo "使用 $SDKMANAGER（SDK 根：$SDK_ROOT）"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_ROOT" > android/local.properties
      - name: 接受 Android SDK 许可（sdkmanager 是交互式的，全 y）
        run: yes | "$SDKMANAGER" --licenses || true
      - name: 安装 Android SDK 组件
        run: |
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: 单测 + lint + 构建 APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: 上传 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows-exe:
    name: Windows 独立 exe 构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 检查 tkinter（托盘界面依赖，缺了 PyInstaller 会失败）
        run: python -c "import tkinter; print('tkinter OK')"
      - name: 构建 exe
        shell: powershell
        run: ./scripts/build_windows.ps1
      - name: 上传独立 exe
        uses: actions/upload-artifact@v4
        with:
          name: OIT-Portal-windows
          path: dist/OIT-Portal.exe
          if-no-files-found: error
