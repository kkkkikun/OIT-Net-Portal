schema: spec-driven

# 项目上下文（创建任何 OpenSpec 产物时展示给 AI）
context: |
  Tech stack: Python 3.9+，单代码库双端共用（Windows 计划任务 / Android Termux）
  Dependencies: requests, pycryptodome (AES-128-CBC 复现，缺失时优雅降级), tomli (<3.11)
  Testing: pytest（85 用例，全部无网络，FakeSession + fixture 状态机）
  Formatting: 无强制工具，遵循仓库现有代码风格（见 AGENTS.md）
  语言: 所有产出物用简体中文撰写，技术术语（API、SSO、ePortal、AES 等）保持英文原样。
  领域: 校园网（鄂尔多斯应用技术学院）静默自动登录 + 保活工具。
  核心机制: 登录协议不是写死的，而是 oit-portal capture 抓包向导自动发现，
            写入用户配置目录 protocol.json，运行时经 protocol_overrides 合并进 CAPTURED 常量块。
  安全约束: 日志永不记录明文密码/cookie（只用 fingerprint() 记前4位+长度）；
            HTTP 必须 trust_env=False 直连校园 AC；
            配置文件（config.toml / credentials.toml / session.json）不入库。

rules:
  proposal:
    - 包含回滚方案
    - 说明为什么做、做什么、不做什么（Non-goals）
    - 标注影响范围（尤其是否触碰 CAPTURED 协议常量块、安全脱敏逻辑）
    - 协议相关变更必须引用 docs/protocol-notes.md 的 C1/C2/C3/C4 编号
  specs:
    - 使用 Given/When/Then 格式描述行为（### Requirement + #### Scenario）
    - 每个 spec.md 包含版本号和最后更新日期
    - 变更时使用 Delta Specs（ADDED/MODIFIED/REMOVED）
    - 修改 sso.py / eportal.py 的 CAPTURED 块时只改值、保持键名稳定
  design:
    - 复杂流程需包含序列图
    - 标注关键依赖关系（尤其 AES key 动态提取、pycryptodome 可选依赖）
    - 包含备选方案对比
    - 新 Session 必须 trust_env=False
  tasks:
    - 每个任务可独立验证（pytest 无网络用例）
    - 标注依赖关系
    - 包含验收标准
